# compose.yaml
# Docker Compose configuration for Student Management App
# Services: web (Rails), sidekiq (background jobs), redis (message broker)
# Run with: docker compose up

services:
  # Redis - Message broker for Sidekiq background job queue
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # Web - The Rails application (Thruster + Puma)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3001:80"
    environment:
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      REDIS_URL: redis://redis:6379
      RAILS_LOG_TO_STDOUT: "true"
      RAILS_ASSUME_SSL: "false"
      RAILS_FORCE_SSL: "false"
    volumes:
      - rails_storage:/rails/storage
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80/up" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Sidekiq - Background job processor (same image as web, different command)
  sidekiq:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: bundle exec sidekiq
    environment:
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      REDIS_URL: redis://redis:6379
      RAILS_LOG_TO_STDOUT: "true"
    volumes:
      - rails_storage:/rails/storage
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - app_network

volumes:
  rails_storage:
    driver: local
  redis_data:
    driver: local

networks:
  app_network:
    driver: bridge
